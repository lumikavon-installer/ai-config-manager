name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify release tag matches package version
        run: node scripts/check-version.mjs
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path=integrations/rust/Cargo.toml
      - run: cargo test --locked --manifest-path=src-tauri/settings-tests/Cargo.toml
      - run: cargo fmt --all -- --check

  publish:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: msi,nsis
          - os: macos-14
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI配置管理器 ${{ github.ref_name }}"
          releaseBody: |
            Desktop builds for Windows, macOS (Apple silicon) and Linux.

            These installers are **unsigned**; the operating system may warn
            about an unidentified developer. The Chinese display name is
            AI配置管理器; the executable remains ai-config-manager. The Windows
            NSIS installer lets you choose 简体中文 or English; the MSI is zh-CN.
            Windows installers include ai-config-manager-cli in System32; Debian
            packages install it to /usr/local/bin. Standalone CLI archives are
            provided for all release platforms; AppImage does not install files
            into the host system.

            The app stores credentials in the OS keychain. It only contacts
            {base_url}/models when the user explicitly runs Test AI connection.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify and publish standalone CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=ai-config-manager-cli
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          "./target/release/$exe" --help
          archive="ai-config-manager-cli-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "$archive" -C target/release "$exe"
          gh release upload "$GITHUB_REF_NAME" "$archive"

  finalize:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
